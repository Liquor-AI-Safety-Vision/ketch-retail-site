; Installed by deploy/install.sh (@ROOT@ is replaced with the repo path).
; Logs: @ROOT@/deploy/runtime/logs/. Control: deploy/liquorctl.

[group:liquor]
programs=liquor-mediamtx,liquor-api,liquor-web,liquor-ai

[program:liquor-mediamtx]
command=@ROOT@/deploy/bin/run-mediamtx.sh
priority=10
autostart=false
autorestart=true
startsecs=5
; ffmpeg publishers are its children: stop them with it.
stopasgroup=true
killasgroup=true
stdout_logfile=@ROOT@/deploy/runtime/logs/mediamtx.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

[program:liquor-api]
command=@ROOT@/deploy/bin/run-api.sh
priority=20
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
stdout_logfile=@ROOT@/deploy/runtime/logs/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

[program:liquor-web]
command=@ROOT@/deploy/bin/run-web.sh
priority=30
autostart=false
autorestart=true
startsecs=3
stopasgroup=true
stdout_logfile=@ROOT@/deploy/runtime/logs/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

[program:liquor-ai]
command=@ROOT@/deploy/bin/run-ai.sh
priority=40
autostart=false
autorestart=true
; It first waits for every camera stream (test mode normalises footage on
; the very first start), so it counts as started only once it is running.
startsecs=10
startretries=100
; SIGTERM to the pipeline's parent only: it stops the tiers itself and
; flushes pending alerts and clips (up to post_s + upload) before exiting.
stopsignal=TERM
stopasgroup=false
killasgroup=true
stopwaitsecs=330
stdout_logfile=@ROOT@/deploy/runtime/logs/ai.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true
